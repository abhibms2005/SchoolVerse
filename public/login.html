<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — SchoolVerse</title>
<meta name="theme-color" content="#14213D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314213D'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23FAF7F0' text-anchor='middle'%3ES%3C/text%3E%3Cpath d='M14 50 L50 14' stroke='%23C9A227' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="login-body">
<a class="skip-link" href="#login-form">Skip to form</a>

<main class="login-card" id="login-form">
  <a class="brand" href="/" aria-label="SchoolVerse — back to landing">
    <span class="brand-mark" aria-hidden="true">S</span>
    <span class="brand-name">School<em>Verse</em></span>
  </a>
  <h1>Admin sign in</h1>
  <p class="login-sub">Welcome back. The office is waiting.</p>

  <div class="login-error" id="loginError" role="alert"></div>

  <form id="loginForm" novalidate>
    <div class="field" style="margin-bottom:1.1rem;">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required placeholder="you@school.org">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn--gold" id="submitBtn">Sign in</button>
  </form>

  <a class="login-back" href="/">← Back to the landing page</a>
</main>

<script src="/app.js"></script>
<script>
(function () {
  'use strict';
  var form = document.getElementById('loginForm');
  var errorEl = document.getElementById('loginError');
  var btn = document.getElementById('submitBtn');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorEl.classList.remove('show');
    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    apiFetch('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    })
      .then(function () { window.location.href = '/dashboard.html'; })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'Sign in';
        errorEl.textContent = err.message === 'unauthorized' ? 'Invalid email or password.' : 'Could not reach the server: ' + err.message;
        errorEl.classList.add('show');
      });
  });
})();
</script>
</body>
</html>
